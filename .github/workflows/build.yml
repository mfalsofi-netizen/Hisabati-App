
name: Build Hisabati APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o hisabati-project.zip -d appsrc

      - name: Inspect extracted source
        run: |
          echo '=== FILES ==='
          find appsrc/hisabati-project -maxdepth 3 -type f -printf '%p (%s bytes)\\n' | sort
          for f in package.json capacitor.config.json README.md www/index.html www/app.js; do
            echo "=== $f ==="
            sed -n '1,260p' "appsrc/hisabati-project/$f"
          done

      - name: Apply source patches
        run: |
          python3 patches/print-layout.py
          python3 patches/order-form.py
          python3 patches/final-updates.py
          node --check appsrc/hisabati-project/www/app.js

      - name: Locate project
        run: |
          DIR=$(find appsrc -name package.json -printf '%h\n' | head -1)
          test -n "$DIR"
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: cd "$APP_DIR" && npm install

      - name: Build Android APK
        run: |
          cd "$APP_DIR"
          npx cap add android
          python3 ../../patches/native-print.py
          python3 ../../patches/native-contacts.py
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisabati-APK
          path: appsrc/**/android/app/build/outputs/apk/debug/app-debug.apk
